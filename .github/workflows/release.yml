# Builds a release when a version tag (e.g. v0.2.0) is pushed.
# The zip contains ONLY the Uncs_Tavern/ addon folder, unchanged, so extracting
# it into Interface\AddOns gives AddOns\Uncs_Tavern\Uncs_Tavern.toc.
# Release notes come from that version's section in CHANGELOG.md.
#
# Hardening: runs only on tag pushes (never on pull requests), no stored secrets,
# the only action is pinned to a commit, write access is granted to this one job,
# the checkout doesn't keep the token, and the tag name reaches the shell only as
# an environment variable (never pasted into the script).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned to a commit)
        with:
          persist-credentials: false

      - name: Check the tag looks like a version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the .toc version matches the tag
        run: |
          TOC_VERSION=$(grep -m1 '^## Version:' Uncs_Tavern/Uncs_Tavern.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ "$TOC_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match '## Version: ${TOC_VERSION}' in Uncs_Tavern.toc"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found && /^\[[^]]+\]: / { exit }
            found                   { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ] || ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::No '## [${VERSION}]' section found in CHANGELOG.md"
            exit 1
          fi
          cat release_notes.md

      - name: Zip the addon folder
        run: |
          ZIP="Uncs_Tavern-${TAG}.zip"
          zip -r -X "$ZIP" Uncs_Tavern
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unc's Tavern $TAG" \
            --notes-file release_notes.md \
            --verify-tag
